<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · Fragrance Wholesaler USA</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<!-- The design system (tokens, components, app shell) is shared by every page; this page only adds report pieces. -->
<link rel="stylesheet" href="/css/ads.css">
<script src="/js/ui.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/platforms.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<style>
  /* Report pieces: intro text, KPI tiles, chart cards, product cells, tier row tint, tables' small marks. */
  .lead { margin: 0 0 16px; color: var(--ds-text-subtle); max-width: 1000px; }
  .lead b { color: var(--ds-text); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { display: block; background: var(--ds-surface-raised); box-shadow: var(--ds-shadow-raised); border-radius: 8px; padding: 12px 16px; text-align: left;
    color: var(--ds-text); font-weight: 400; min-height: 0; white-space: normal; }
  button.kpi { cursor: pointer; } button.kpi:hover { background: var(--ds-surface-raised); box-shadow: var(--ds-shadow-raised), inset 0 0 0 1px var(--ds-border-selected); }
  .kpi .label { color: var(--ds-text-subtle); font-size: 12px; font-weight: 600; line-height: 16px; }
  .kpi .value { font: 600 24px/28px var(--ds-font); margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--ds-text-subtlest); font-size: 12px; line-height: 16px; }
  .kpi.alert .value { color: var(--ds-text-danger); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; margin-bottom: 16px; }
  .grid .card { margin-bottom: 0; }
  .chart { position: relative; height: 300px; }
  td.prod { text-align: left; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  td.prod b { font-weight: 600; margin-right: 6px; } td.prod span { color: var(--ds-text-subtlest); }
  td.wrap { white-space: normal; min-width: 280px; }
  /* Long text in wide tables is clipped to one line (hover shows it all); the large view shows it in full. */
  .clip { display: inline-block; max-width: var(--w, 320px); overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  /* Expand button at the top right of every card with a table, and the large view it opens. */
  .card.has-expand { position: relative; }
  .card.has-expand > .expand { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; min-height: 32px; padding: 0; justify-content: center; }
  .card.has-expand > .expand svg { width: 18px; height: 18px; }
  .card.has-expand > h3, .card.has-expand > .head { padding-right: 40px; }
  body.has-expanded { overflow: hidden; }
  body.has-expanded::before { content: ""; position: fixed; inset: 0; z-index: 40; background: var(--ds-blanket); }
  .card.expanded { position: fixed; inset: 24px; z-index: 41; margin: 0; overflow: auto; box-shadow: var(--ds-shadow-overlay); display: flex; flex-direction: column; }
  .card.expanded .tablewrap { flex: 1; min-height: 0; }
  .card.expanded td.prod { max-width: none; white-space: normal; }
  .card.expanded .clip { max-width: none; white-space: normal; }
  /* Rows tinted by the product's tier, with a solid stripe on the left edge. */
  tbody tr[data-tier] td { background: color-mix(in srgb, var(--rowc) 7%, var(--ds-surface-raised)); }
  tbody tr[data-tier] td:first-child { box-shadow: inset 3px 0 0 var(--rowc); }
  tbody tr.click:hover td { background: color-mix(in srgb, var(--ds-text-brand) 9%, var(--ds-surface-raised)); }
  .calc { color: var(--ds-text-subtlest); font-size: 11px; margin-left: 4px; }
  details.settings { font-size: 12px; } details.settings summary { cursor: pointer; color: var(--ds-link); display: inline; }
  details.settings .row { margin-top: 8px; } details.settings input[type=number] { width: 72px; }
  #status { padding: 64px 24px; text-align: center; color: var(--ds-text-subtlest); }
  /* Platform mix list: logo and name, a bar scaled to the top platform, units and share, products selling, best seller. */
  .pmix-head, .pmix-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(48px, 1.2fr) 104px 96px minmax(128px, 1.1fr); gap: 12px; align-items: center; }
  .pmix-head { padding: 0 8px 6px; border-bottom: 1px solid var(--ds-border); color: var(--ds-text-subtlest); font: 600 12px/16px var(--ds-font); }
  .pmix-row { width: 100%; min-height: 36px; padding: 4px 8px; background: none; border-radius: 4px; font-weight: 400; color: var(--ds-text); text-align: left; }
  .pmix-row:hover { background: var(--ds-bg-subtle-hovered); }
  .pmix-row.on { background: var(--ds-bg-selected); box-shadow: inset 2px 0 0 var(--ds-border-selected); }
  .pm-name { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; } .pm-name > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pm-bar { height: 10px; background: var(--ds-bg-neutral); border-radius: 0 4px 4px 0; overflow: hidden; }
  .pm-bar i { display: block; height: 100%; background: var(--ds-chart-brand); border-radius: 0 4px 4px 0; }
  .pm-num { text-align: right; font-variant-numeric: tabular-nums; } .pm-num b { font-weight: 600; } .pm-num small, .pm-skus small { color: var(--ds-text-subtlest); margin-left: 6px; font-size: 12px; }
  .pm-skus { text-align: right; font-variant-numeric: tabular-nums; }
  .pm-top { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ds-text-subtle); font-variant-numeric: tabular-nums; } .pm-top b { color: var(--ds-text); font-weight: 600; }
  @media (max-width: 900px) {
    .pmix-head, .pmix-row { grid-template-columns: minmax(96px, 1fr) minmax(40px, 1fr) 96px; gap: 8px; }
    .pmix-head span:nth-child(n+4), .pm-skus, .pm-top { display: none; }
  }
  /* Search: the "Showing results for" banner and the product suggestions dropdown. */
  .searchnote { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; padding: 8px 12px; border-radius: 6px;
    background: var(--ds-bg-information, var(--ds-bg-selected)); color: var(--ds-text); }
  .searchnote svg { width: 16px; height: 16px; color: var(--ds-icon-information, var(--ds-text-selected)); }
  .searchnote span { flex: 1; min-width: 0; }
  .dd-item.sug .nm b { font-weight: 600; margin-right: 4px; }
  .dd-empty { padding: 12px 16px; color: var(--ds-text-subtlest); }
  .dd-trigger .val { display: inline-flex; align-items: center; gap: 6px; }
  .dd-item svg { width: 16px; height: 16px; }
  /* Phone: tiles two to a row and smaller; the intro text shows two lines until tapped. */
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .kpi { padding: 8px 10px; } .kpi .value { font-size: 18px; line-height: 22px; } .kpi .sub { font-size: 11px; }
    .lead { font-size: 13px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; margin-bottom: 12px; }
    .lead.open { display: block; }
    .chart { height: 240px; }
    .grid { gap: 12px; margin-bottom: 12px; }
    .card.expanded { inset: 8px; padding: 12px; }
  }
</style>
</head>
<body data-page="reports">
<div class="shell-main">
  <div class="pagehead">
    <h1 id="title">Overview</h1>
    <button id="csv" title="Download this view's main table, with the filters applied" hidden>Export CSV</button>
  </div>
  <div id="status">Fetching products…</div>
  <div id="app" class="page" hidden><main id="main"></main></div>
</div>

<!-- Product detail (and TikTok competitor listings) open in this modal. -->
<dialog id="detail"><div class="dh"><div><h3 id="dTitle"></h3><div class="meta" id="dSub"></div></div>
  <button class="subtle" id="dClose">Close</button></div><div class="db" id="dBody"></div></dialog>

<script>shell.mount();</script>
<script src="/js/reports.js"></script>
<script src="/js/excel-edit.js"></script>
</body>
</html>
