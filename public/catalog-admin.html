<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog management · Fragrance Wholesaler USA</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<!-- Same design system and shell as the reports page; catalog-admin.js adds this page's own pieces. -->
<link rel="stylesheet" href="/css/ads.css">
<script src="/js/ui.js"></script>
<script src="/js/shell.js"></script>
</head>
<body data-page="catalog-admin">
<div class="shell-main">
  <div class="pagehead"><div><h1>Catalog management</h1>
    <p class="desc">Your customer catalogs: add or remove them, and set what each one shows, its prices, products and password.</p></div></div>
  <main id="main" class="page"><section class="card"><p class="muted">Loading…</p></section></main>
</div>
<script>shell.mount();</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtUsd = v => v == null ? "—" : v.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 });
const ST = { tab: "catalog" };
const render = () => { $("main").innerHTML = window.catalogAdminHtml(); };
</script>
<script src="/js/catalog-admin.js"></script>
<script>
// Sign-in ran out: back to the sign-in page, then here.
const origFetch = window.fetch;
window.fetch = async (...args) => { const r = await origFetch(...args); if (r.status === 401) location.assign("/login?next=/catalog-admin.html"); return r; };
render();
</script>
</body>
</html>
