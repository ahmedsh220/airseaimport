<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog management · Fragrance Wholesaler USA</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/ads.css">
<style>
  main { padding: 20px 32px 48px; max-width: 1400px; }
  td.prod { text-align: left; }
  /* catalog-admin.js styles its own controls; these bring them in line with the ADS look (higher specificity wins). */
  body .ca-tabs { display: flex; gap: 0; margin: 0 0 16px; border-bottom: 2px solid var(--ds-border); }
  body .ca-tabs button { background: none; border-radius: 0; margin: 0 0 -2px; padding: 8px 12px; color: var(--ds-text-subtle); border-bottom: 2px solid transparent; }
  body .ca-tabs button:first-child, body .ca-tabs button:last-child { border-radius: 0; }
  body .ca-tabs button:hover { color: var(--ds-text); background: none; }
  body .ca-tabs button.active { background: none; color: var(--ds-text-selected); border-bottom-color: var(--ds-border-selected); }
  body .ca-save { background: var(--ds-surface-raised); padding: 12px 0 4px; }
  body .ca-save button.primary { background: var(--ds-bg-brand-bold); color: var(--ds-text-inverse); }
  body .ca-save button.primary:disabled { background: var(--ds-bg-disabled); color: var(--ds-text-disabled); opacity: 1; }
  @media (max-width: 900px) { main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body data-page="catalog-admin">
<div class="shell-main">
  <div class="pagehead">
    <div class="crumbs">Catalog / <span>Catalog management</span></div>
    <div class="titlerow"><h1>Catalog management</h1></div>
    <p class="desc">Catalog 1 and Catalog 2: what customers see, prices, products and passwords.</p>
  </div>
  <main id="main"><section class="card"><p class="muted">Loading…</p></section></main>
</div>
<script src="/js/shell.js"></script>
<script>shell.mount();</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtUsd = v => v == null ? "—" : v.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 });
const ST = { tab: "catalog" };
const render = () => { $("main").innerHTML = window.catalogAdminHtml(); };
</script>
<script src="/js/catalog-admin.js"></script>
<script>
// Sign-in ran out: back to the sign-in page, then here.
const origFetch = window.fetch;
window.fetch = async (...args) => { const r = await origFetch(...args); if (r.status === 401) location.assign("/login?next=/catalog-admin.html"); return r; };
render();
</script>
</body>
</html>
