<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog management · Air Sea Import</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<!-- Same look as the dashboard: this block is copied from index.html. -->
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b1f24; --muted: #667085; --border: #e4e7ec;
    --accent: #2563eb; --accent-soft: #eef3ff; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
    --t-super: #7c3aed; --t-hero: #2563eb; --t-green: #15803d; --t-new: #0891b2; --t-dead: #6b7280; --t-other: #b45309;
    --t-empty: #9f1239; --t-breathing: #ca8a04;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e6e8eb; --muted: #9aa3af; --border: #2a2f3a;
            --accent: #60a5fa; --accent-soft: #1a2436; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
            --t-super: #a78bfa; --t-hero: #60a5fa; --t-green: #4ade80; --t-new: #22d3ee; --t-dead: #9ca3af; --t-other: #fbbf24;
            --t-empty: #fb7185; --t-breathing: #facc15; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: var(--text); background: var(--panel);
         border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
           padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 17px; }
  .meta { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  aside { background: var(--panel); border-right: 1px solid var(--border); padding: 14px 10px; position: sticky; top: 0;
          height: 100vh; overflow: auto; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 8px 8px; }
  .plat { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px; background: none; }
  .plat:hover { background: var(--accent-soft); }
  .plat.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .plat .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .plat .top span:last-child { font-variant-numeric: tabular-nums; }
  .plat .bar { height: 4px; border-radius: 2px; background: var(--border); margin: 5px 0 3px; overflow: hidden; }
  .plat .bar i { display: block; height: 100%; background: var(--accent); }
  .plat .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .content { min-width: 0; }
  nav.tabs { display: flex; gap: 2px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 11px 14px;
                    font-weight: 600; color: var(--muted); white-space: nowrap; }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .bar2 { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
          padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .bar2 input[type=search] { min-width: 220px; flex: 1; max-width: 360px; }
  label.t { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .seg { display: inline-flex; } .seg button { border-radius: 0; margin-left: -1px; padding: 5px 10px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin: 0; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  main { padding: 18px 20px 48px; max-width: 1600px; }
  .lead { margin: 0 0 14px; color: var(--muted); }
  .lead b { color: var(--text); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-align: left; }
  button.kpi:hover { border-color: var(--accent); }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: 12px; }
  .kpi.alert .value { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 16px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; margin-bottom: 16px; }
  .grid .card { margin-bottom: 0; }
  .card h3 { margin: 0 0 2px; font-size: 15px; }
  .card .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .card .head { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .chart { position: relative; height: 300px; }
  .tablewrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 9px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th.l, td.l { text-align: left; }
  td.prod { text-align: left; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  td.prod b { font-weight: 600; margin-right: 6px; } td.prod span { color: var(--muted); }
  thead th { position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; font-weight: 600; z-index: 1; font-size: 12px; }
  thead tr.grp th { cursor: default; top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; border-left: 1px solid var(--border); }
  thead tr.grp + tr th { top: 28px; }
  th.sorted::after { content: " ▾"; } th.sorted.asc::after { content: " ▴"; }
  /* Rows tinted by the product's tier, with a solid stripe on the left edge. */
  tbody tr[data-tier] td { background: color-mix(in srgb, var(--rowc) 13%, var(--panel)); }
  tbody tr[data-tier] td:first-child { box-shadow: inset 4px 0 0 var(--rowc); }
  tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--accent-soft); }
  tfoot td { font-weight: 650; background: var(--bg); position: sticky; bottom: 0; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; }
  .tier { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 650; text-transform: uppercase; color: #fff; }
  .chip { display: inline-flex; gap: 4px; align-items: center; background: var(--accent-soft); color: var(--accent);
          border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; font-weight: 600; }
  .chip button { border: 0; background: none; color: inherit; padding: 0 6px; }
  td.wrap { white-space: normal; min-width: 280px; }
  .calc { color: var(--muted); font-size: 11px; margin-left: 3px; }
  .est { color: var(--warn); font-size: 10px; font-weight: 650; margin-left: 3px; text-transform: uppercase; }
  .coverage { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px;
              padding: 8px 12px; margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .coverage.partial { border-left-color: var(--warn); }
  .coverage b { color: var(--text); } .coverage div { margin-top: 3px; }
  .coverage summary { cursor: pointer; } details.coverage { padding: 5px 12px; }
  details.settings { font-size: 12px; } details.settings summary { cursor: pointer; color: var(--muted); }
  details.settings .row { margin-top: 8px; } details.settings input { width: 70px; padding: 3px 6px; }
  .filterbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 12px;
    padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); }
  details.colpick { margin-bottom: 10px; }
  details.colpick > summary { display: inline-block; list-style: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent);
    padding: 6px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); }
  details.colpick > summary::-webkit-details-marker { display: none; }
  details.colpick > summary::before { content: "▸ "; } details.colpick[open] > summary::before { content: "▾ "; } details.colpick input { width: auto; padding: 0; }
  details.colpick .colgrp { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  details.colpick .colgrp label { white-space: nowrap; } details.colpick .colg { flex-basis: 100%; }
  #status { padding: 40px; text-align: center; color: var(--muted); }
  #status .err { color: var(--bad); margin-bottom: 12px; }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
           width: min(960px, calc(100vw - 32px)); max-height: 88vh; padding: 0; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog .dh { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 14px 18px;
               border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  dialog .db { padding: 14px 18px; }
  dialog h3 { margin: 0; font-size: 16px; } dialog h4 { margin: 16px 0 8px; font-size: 13px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .facts div { background: var(--bg); border-radius: 8px; padding: 7px 10px; }
  .facts span { display: block; color: var(--muted); font-size: 11px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 6px; overflow-x: auto; padding: 8px 12px; }
    aside h2 { display: none; }
    .plat { flex: 0 0 auto; width: auto; min-width: 130px; margin: 0; }
    main, header, .bar2, nav.tabs { padding-left: 16px; padding-right: 16px; }
  }
</style>
<style>
  main { margin: 0 auto; }
</style>
</head>
<body data-page="catalog-admin">
<header>
  <div>
    <h1>Air Sea Import · Catalog management</h1>
    <div class="meta">Catalog 1 and Catalog 2: what customers see, prices, products and passwords</div>
  </div>
  <div class="row">
    <a href="/"><button type="button">Back to dashboard</button></a>
    <a href="/logout"><button type="button">Sign out</button></a>
  </div>
</header>
<main id="main"><section class="card"><p class="muted">Loading…</p></section></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtUsd = v => v == null ? "—" : v.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 });
const ST = { tab: "catalog" };
const render = () => { $("main").innerHTML = window.catalogAdminHtml(); };
</script>
<script src="/js/catalog-admin.js"></script>
<script>
// Sign-in ran out: back to the sign-in page, then here.
const origFetch = window.fetch;
window.fetch = async (...args) => { const r = await origFetch(...args); if (r.status === 401) location.assign("/login?next=/catalog-admin.html"); return r; };
render();
</script>
</body>
</html>
